name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to v5.0.0, not a floating v5: this action publishes no moving
      # major tag, so `@v5` fails at action resolution before doing any work.
      - uses: actions/dependency-review-action@v5.0.0
