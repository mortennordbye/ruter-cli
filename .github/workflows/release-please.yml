name: Release Please

# release-please reads the Conventional Commit history on main and opens a PR that bumps
# the version and updates CHANGELOG.md; merging that PR cuts the tag and the GitHub
# release. This repo uses the light profile, which has no PR-title check and allows direct
# pushes to main — so the version it computes is only as correct as the commit messages
# written by hand. See CONTRIBUTING notes in README.md.

on:
  push:
    branches: [main]

# Read-only at the top level, write scoped to the job that needs it. A workflow-wide write
# token is handed to every job and every step in it, including any action added later;
# Scorecard's Token-Permissions check scores exactly this.
permissions:
  contents: read

jobs:
  release:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release

  # Called directly rather than letting release.yml listen for `release: published`.
  # release-please publishes that release with GITHUB_TOKEN, and GitHub does not start
  # new workflow runs from events raised by that token — so an event-triggered build
  # would look correct and silently never fire. Staying inside this run avoids that.
  binaries:
    name: Binaries
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      # The release is created as a draft, so its tag does not exist yet — build the
      # commit release-please released instead. release.yml publishes it once the
      # assets are up, which is what finally creates the tag.
      ref: ${{ needs.release.outputs.sha }}
