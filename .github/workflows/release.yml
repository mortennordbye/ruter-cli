name: Release Binaries

# Called by release-please.yml once it has cut a release, and runnable by hand to
# backfill assets onto an existing tag.
#
# Deliberately NOT triggered by `release: published` or by a `v*` tag push: release-please
# creates both using GITHUB_TOKEN, and GitHub does not start new workflow runs from events
# raised by that token. A `release: published` trigger here looks correct and silently
# never fires. Being called directly keeps it inside the same run, which has no such rule.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach assets to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # One download instead of asking people to know their own CPU. Each slice carries
      # its own __TEXT,__info_plist section from build.rs, and lipo preserves it.
      - name: Combine into a universal binary
        run: |
          lipo -create -output ruter \
            target/aarch64-apple-darwin/release/ruter \
            target/x86_64-apple-darwin/release/ruter
          lipo -info ruter
          otool -s __TEXT __info_plist ruter | head -2

      # Shipped as an .app bundle because that is what lets Core Location grant this tool
      # its own Location Services permission; a bare binary never gets prompted at all.
      # See scripts/install-macos.sh and the README for the full explanation.
      - name: Assemble Ruter.app
        run: |
          mkdir -p Ruter.app/Contents/MacOS
          cp macos/Info.plist Ruter.app/Contents/Info.plist
          cp ruter Ruter.app/Contents/MacOS/ruter
          codesign --force --sign - Ruter.app
          codesign --verify --verbose Ruter.app

      - name: Package
        id: package
        run: |
          name="ruter-${{ inputs.tag }}-macos-universal"
          mkdir -p "dist/$name"
          cp -R Ruter.app "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp .github/release-assets/install-macos.sh "dist/$name/install.sh"
          chmod +x "dist/$name/install.sh"
          tar -czf "$name.tar.gz" -C dist "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ steps.package.outputs.asset }}.tar.gz
            ${{ steps.package.outputs.asset }}.tar.gz.sha256

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners on purpose: cross-compiling rustls' `ring` needs a C
          # cross-toolchain, which is a lot of yak-shaving to avoid two cheap runners.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          name="ruter-${{ inputs.tag }}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ruter "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ steps.package.outputs.asset }}.tar.gz
            ${{ steps.package.outputs.asset }}.tar.gz.sha256
