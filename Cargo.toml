[package]
name = "ruter-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal departure board for Norwegian public transport, powered by the Entur API"
license = "MIT"
repository = "https://github.com/mortennordbye/ruter-cli"
readme = "README.md"
keywords = ["cli", "transit", "entur", "ruter", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "ruter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = { version = "3.3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = [
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDate",
    "NSError",
    "NSRunLoop",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
